openapi: 3.0.3
info:
  title: API Culturando
  description: API REST em arquitetura N-camadas para a plataforma Culturando.
  version: 1.0.0
servers:
  - url: http://localhost:3001/api/v1
    description: Servidor Local de Desenvolvimento
paths:
  /health:
    get:
      summary: Verificação de saúde da API e conexão com o banco de dados
      tags:
        - Sistema
      responses:
        '200':
          description: API saudável e conectada ao banco de dados
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  database:
                    type: string
                    example: conectado

  /auth/register:
    post:
      summary: Cadastrar um novo usuário comprador
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Dados de cadastro inválidos

  /auth/login:
    post:
      summary: Autenticar usuário (comprador ou organizador)
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Renovar token de acesso
      tags:
        - Autenticação
      responses:
        '200':
          description: Token renovado com sucesso
        '401':
          description: Token de renovação inválido ou expirado

  /auth/logout:
    post:
      summary: Encerrar sessão do usuário
      tags:
        - Autenticação
      responses:
        '204':
          description: Sessão encerrada com sucesso

  /events:
    get:
      summary: Listar eventos culturais com filtros
      tags:
        - Eventos
      parameters:
        - in: query
          name: featured
          schema:
            type: boolean
          description: Filtrar apenas eventos em destaque
        - in: query
          name: category
          schema:
            type: string
          description: Categoria do evento
        - in: query
          name: organizerId
          schema:
            type: string
            format: uuid
          description: ID do organizador
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de eventos cadastrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

    post:
      summary: Criar novo evento cultural (Organizador)
      tags:
        - Eventos
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Evento criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Não autenticado
        '403':
          description: Permissão negada (requer perfil organizador)

  /events/{id}:
    get:
      summary: Detalhes de um evento pelo ID ou Slug
      tags:
        - Eventos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dados completos do evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Evento não encontrado

    patch:
      summary: Atualizar evento existente (Organizador dono do evento)
      tags:
        - Eventos
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Evento atualizado
        '403':
          description: Permissão negada para editar este evento
        '404':
          description: Evento não encontrado

    delete:
      summary: Excluir evento (Organizador dono do evento)
      tags:
        - Eventos
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Evento excluído com sucesso
        '403':
          description: Permissão negada
        '409':
          description: Conflito (não é possível excluir evento com ingressos vendidos)

  /organizer/events:
    get:
      summary: Listar eventos do organizador autenticado
      tags:
        - Organizador
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de eventos pertencentes ao organizador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          description: Não autenticado

  /orders:
    post:
      summary: Criar pedido / comprar ingressos para evento
      tags:
        - Pedidos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Pedido registrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Tipo de ingresso ou quantidade inválida

  /orders/{id}:
    get:
      summary: Obter detalhes do pedido
      tags:
        - Pedidos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Pedido não encontrado

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - state
      properties:
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          format: email
          example: maria@example.com
        password:
          type: string
          minLength: 6
          example: segredo123
        state:
          type: string
          example: SP

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: empresa@example.com
        password:
          type: string
          example: segredo
        role:
          type: string
          enum: [buyer, organizer]
          default: buyer

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            role:
              type: string
            state:
              type: string

    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        organizerId:
          type: string
          format: uuid
        title:
          type: string
        category:
          type: string
        date:
          type: string
          format: date-time
        location:
          type: string
        price:
          type: number
        ticketPrices:
          type: object
          properties:
            inteira:
              type: number
            meia:
              type: number
            pcd:
              type: number
        description:
          type: string
        imageUrl:
          type: string
        imageAlt:
          type: string
        featured:
          type: boolean
        soldOut:
          type: boolean
        accessibilityGroups:
          type: array
          items:
            type: string
        assistiveResources:
          type: array
          items:
            type: string
        onsiteSupport:
          type: string

    CreateEventRequest:
      type: object
      required:
        - title
        - date
        - location
        - price
        - description
        - accessibilityGroups
        - assistiveResources
        - onsiteSupport
      properties:
        title:
          type: string
        date:
          type: string
        location:
          type: string
        price:
          type: number
        description:
          type: string
        accessibilityGroups:
          type: array
          items:
            type: string
        assistiveResources:
          type: string
        onsiteSupport:
          type: string

    UpdateEventRequest:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        location:
          type: string
        price:
          type: number
        description:
          type: string
        accessibilityGroups:
          type: array
          items:
            type: string
        assistiveResources:
          type: string
        onsiteSupport:
          type: string

    CreateOrderRequest:
      type: object
      required:
        - eventId
        - ticketType
        - quantity
      properties:
        eventId:
          type: string
          format: uuid
        ticketType:
          type: string
          enum: [inteira, meia, pcd]
        quantity:
          type: integer
          minimum: 1
          maximum: 10

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        buyerId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        ticketType:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        total:
          type: number
        status:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dados de entrada inválidos.
            fields:
              type: object
            requestId:
              type: string
